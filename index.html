<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<title>Household Budget</title>
<meta name="theme-color" content="#1e6a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#18232f; --muted:#5d6b79; --line:#d9dfe5;
  --accent:#1e6a8a; --accent-ink:#ffffff; --ok:#1f7a4d; --ok-bg:#dcf1e5; --warn:#8a5a00; --warn-bg:#fdf0cf;
  --bad:#b3261e; --bad-bg:#fbe0dd; --chip:#e4e9ee;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111820; --surface:#1a232d; --ink:#e8edf2; --muted:#9aa8b6; --line:#2c3845;
    --accent:#5fb4d6; --accent-ink:#0c1620; --ok:#6fd09b; --ok-bg:#16382a; --warn:#f0c46a; --warn-bg:#3d3112;
    --bad:#ff8f86; --bad-bg:#44201d; --chip:#26323e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111820; --surface:#1a232d; --ink:#e8edf2; --muted:#9aa8b6; --line:#2c3845;
  --accent:#5fb4d6; --accent-ink:#0c1620; --ok:#6fd09b; --ok-bg:#16382a; --warn:#f0c46a; --warn-bg:#3d3112;
  --bad:#ff8f86; --bad-bg:#44201d; --chip:#26323e; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:84px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
main{max-width:640px;margin:0 auto;padding:16px 14px}
h1{font-size:15px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.01em}
h2{font-size:20px;margin:22px 0 10px;font-weight:650}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.row button:focus-visible,.tab:focus-visible,.chk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 12px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px}
.hero .sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--chip);font-size:13px;font-weight:600}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
svg{display:block;width:100%;height:auto}
.day{margin:16px 2px 6px;font-weight:650;font-size:14px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:34px 1fr auto 34px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{min-width:0} .row .name{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.row .amt{text-align:right;font-weight:650} .row .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.row .amt.in{color:var(--ok)}
.row.done{background:var(--ok-bg)} .row.done .name{text-decoration:line-through;opacity:.75}
.row.late .meta{color:var(--bad);font-weight:600}
.row.neg .amt small{color:var(--bad);font-weight:700}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:16px;line-height:1}
.row.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 4px}
.nav .m{font-weight:700;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .k{font-size:12px;color:var(--muted)} .stat .v{font-weight:700;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.paidoff{background:var(--warn-bg);border-color:var(--warn)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-weight:650} .bar{height:8px;background:var(--chip);border-radius:6px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)} .card .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--chip)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
input[type=number]{width:100%;font:inherit;font-size:22px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:10px 0 14px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ed{width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:17px;border-radius:8px;padding:0}
.ed:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.danger{color:var(--bad);border-color:var(--bad)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line)}
.swb.on{border-color:var(--ink)}
.swb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.btn{display:inline-block}
body.nodata .tabs{display:none}body.nodata{padding-bottom:24px}
textarea{width:100%;min-height:96px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
.err{color:var(--bad);font-weight:600;margin-top:8px}
.fld{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
.fld input,.fld select{display:block;width:100%;font:inherit;font-size:17px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
.seg{display:flex;gap:8px}.seg .btn{flex:1}
.acts{margin-top:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.note{font-size:13px;color:var(--muted);margin:8px 2px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:7px 8px;text-align:right;border-top:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted);border-top:0}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.row.done{transition:background .2s}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="today">Today</button>
  <button class="tab" role="tab" data-tab="month">Month</button>
  <button class="tab" role="tab" data-tab="debts">Debts</button>
  <button class="tab" role="tab" data-tab="plan">Plan</button>
</nav>
<dialog id="dlg"></dialog>
<script>
const EMBED=null;
const IS_PWA=true;
let DATA=EMBED;
try{const _s=localStorage.getItem('hb-data');if(_s)DATA=JSON.parse(_s)}catch(e){}
function validData(o){return o&&Array.isArray(o.events)&&o.events.length&&Array.isArray(o.debts)&&Array.isArray(o.sum)&&typeof o.opening==='number'&&typeof o.start==='string'}
function importText(txt,showErr){
  let o;try{o=JSON.parse(txt)}catch(e){showErr('That doesn’t look like a budget file. It should be the budget-data.json file.');return}
  if(!validData(o)){showErr('This file is missing budget information. Make sure it’s the latest budget-data.json.');return}
  try{localStorage.setItem('hb-data',JSON.stringify(o))}catch(e){showErr('Your browser wouldn’t save the file.');return}
  location.reload();
}
function wireImport(){
  const err=m=>{const e=document.getElementById('imp-err');if(e)e.textContent=m};
  const f=document.getElementById('imp-file');
  if(f)f.addEventListener('change',()=>{const x=f.files&&f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>importText(r.result,err);r.readAsText(x)});
  const b=document.getElementById('imp-paste');
  if(b)b.addEventListener('click',()=>importText(document.getElementById('imp-text').value,err));
}
function onboardHTML(){
  return `<div class="top"><h1>Household budget</h1></div>
  <section class="hero"><div class="big" style="font-size:30px">Load your budget</div>
  <p class="note" style="font-size:15px">Choose your budget file to get started. It is saved only on this device.</p>
  <div class="acts" style="justify-content:flex-start"><label class="btn primary" style="cursor:pointer">Choose budget file<input id="imp-file" type="file" accept=".json,application/json" hidden></label></div>
  <p class="note">Or paste the file’s contents here:</p>
  <textarea id="imp-text" aria-label="Budget file contents" placeholder='{"opening": ...}'></textarea>
  <div class="acts" style="justify-content:flex-start"><button class="btn" id="imp-paste">Load pasted data</button></div>
  <div class="err" id="imp-err" role="alert"></div></section>`;
}
if(!DATA){
  document.body.classList.add('nodata');
  document.getElementById('app').innerHTML=onboardHTML();wireImport();
}else{
const KEY='hb-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S){S={done:{},anchor:null,paidOff:{},tab:'today',month:null};DATA.events.forEach(e=>{if(e.p)S.done[e.id]=1})}
S.custom=S.custom||{inc:[],debts:[]};S.icon=S.icon||{kind:'glyph',glyph:'bars',color:'#1e6a8a'};S.appName=S.appName||'Budget';S.over=S.over||{};S.dbt=S.dbt||{};S.bal=S.bal||{};S.hidden=S.hidden||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const pd=s=>new Date(s+'T12:00:00');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dlabel=d=>WD[d.getDay()]+' '+MN[d.getMonth()]+' '+d.getDate();
function todayStr(){
  const n=new Date(),s=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  const first=DATA.events[0].d,last=DATA.events[DATA.events.length-1].d;
  return s<DATA.start?DATA.start:(s>last?last:s);
}
const TODAY=todayStr();
let EV=DATA.events;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ENDD=DATA.events[DATA.events.length-1].d;
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
function simDebt(c){
  const pays=[];let b=c.bal,y=pd(TODAY).getFullYear(),m=pd(TODAY).getMonth(),last=null;
  for(let k=0;k<120&&b>0.005;k++){
    const dim=new Date(y,m+1,0).getDate(),dd=new Date(y,m,Math.min(c.due,dim),12),s=iso(dd);
    if(s>ENDD)break;
    if(s>=TODAY){const intr=b*c.apr/12,pay=Math.min(c.min,b+intr);pays.push({d:s,pay:Math.round(pay*100)/100});b=b+intr-pay;last=dd}
    m++;if(m>11){m=0;y++}
  }
  return {pays,po:b<=0.005&&last?MN[last.getMonth()]+' '+last.getFullYear():'after Dec 2028'};
}
function buildEV(){
  const ev=DATA.events.map(e=>Object.assign({},e));
  S.custom.inc.forEach(c=>{
    let d=pd(c.date),k=0;
    while(iso(d)<=ENDD&&k<400){
      ev.push({id:'ci:'+c.id+':'+iso(d),d:iso(d),l:c.name,i:c.amt,o:0,c:1});k++;
      if(c.rep==='once')break;
      if(c.rep==='weekly')d=addDays(d,7);
      else if(c.rep==='biweekly')d=addDays(d,14);
      else{const y=d.getFullYear(),m=d.getMonth()+1,dim=new Date(y,m+1,0).getDate();d=new Date(y,m,Math.min(c.day,dim),12)}
    }
  });
  S.custom.debts.forEach(c=>{simDebt(c).pays.forEach(p=>ev.push({id:'cd:'+c.id+':'+p.d,d:p.d,l:c.n+' (min)',i:0,o:p.pay,c:1}))});
  const out=[];
  ev.forEach(e=>{const o=S.over[e.id];
    if(o){if(o.del)return;if(o.l!==undefined)e.l=o.l;if(o.amt!==undefined){if(e.i>0)e.i=o.amt;else e.o=o.amt}if(o.d)e.d=o.d;e.x=1}
    out.push(e)});
  out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(b.i>0)-(a.i>0));
  EV=out;
}
buildEV();
function project(){
  let cash;
  const out={};
  if(!S.anchor){
    cash=DATA.opening;
    EV.forEach(e=>{cash+=e.i-e.o;out[e.id]=cash});
    return {after:out,now:nowFromPlan(out)};
  }
  cash=S.anchor.balance;
  EV.forEach(e=>{if(S.done[e.id]&&!S.anchor.snap[e.id])cash+=e.i-e.o});
  const now=cash;
  EV.forEach(e=>{if(!S.done[e.id]){cash+=e.i-e.o;out[e.id]=cash}});
  return {after:out,now};
}
function nowFromPlan(out){
  let c=DATA.opening;
  EV.forEach(e=>{if(e.d<=TODAY)c=out[e.id]});
  return c;
}
let P=project();
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function toggle(id){
  if(S.done[id])delete S.done[id];else S.done[id]=1;
  save();P=project();render();
}
function row(e,showDate){
  const done=!!S.done[e.id],pend=!done,late=pend&&e.d<TODAY;
  const after=P.after[e.id],neg=after!==undefined&&after<0;
  const isIn=e.i>0;
  const cls='row'+(done?' done':'')+(late?' late':'')+(neg?' neg':'');
  const amt=isIn?e.i:e.o;
  return `<div class="${cls}"><button class="chk" aria-label="${done?'Mark not done':'Mark done'}: ${e.l}" aria-pressed="${done}" data-id="${e.id}">${done?'✓':''}</button>
  <div class="t"><div class="name">${e.l}</div><div class="meta">${showDate?dlabel(pd(e.d))+(late?' · late':''):(isIn?'Money in':'Payment')}${e.c?'<span class="tag">added</span>':''}${e.x?'<span class="tag">edited</span>':''}</div></div>
  <div class="amt num ${isIn?'in':''}">${isIn?'+':''}${fmt(amt)}<small>${after!==undefined?'cash '+fmt(after):'recorded'}</small></div>
  <button class="ed" data-eid="${e.id}" aria-label="Edit ${e.l}">✎</button></div>`;
}
function runway(list){
  const pts=list.map(e=>P.after[e.id]).filter(x=>x!==undefined);
  if(pts.length<2)return '';
  const W=600,H=130,pad=10,mn=Math.min(0,...pts),mx=Math.max(...pts,1);
  const X=i=>pad+i*(W-2*pad)/(pts.length-1),Y=v=>H-pad-(v-mn)*(H-2*pad)/(mx-mn);
  const d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  const li=pts.indexOf(Math.min(...pts)),zy=Y(0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected cash over the next two weeks">
  <line x1="0" x2="${W}" y1="${zy}" y2="${zy}" stroke="var(--line)" stroke-width="2"/>
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${X(li)}" cy="${Y(pts[li])}" r="6" fill="${pts[li]<0?'var(--bad)':'var(--warn)'}"/></svg>`;
}
function viewToday(){
  const horizon=new Date(pd(TODAY).getTime()+14*864e5).toISOString().slice(0,10);
  const pending=EV.filter(e=>!S.done[e.id]&&e.d<=horizon);
  const lateN=pending.filter(e=>e.d<TODAY).length;
  const low=pending.map(e=>P.after[e.id]).filter(x=>x!==undefined);
  const lowest=low.length?Math.min(...low):P.now;
  let h=`<div class="top"><h1>Household budget</h1><span><button class="btn" id="add">Add</button> <button class="btn" id="share">Copy update</button></span></div>
  <section class="hero"><div class="lbl">${S.anchor?'Cash now (as you entered it)':'Cash now (from the plan)'}</div>
  <div class="big num">${fmt(P.now)}</div>
  <div class="sub"><span class="pill ${lowest<0?'bad':lowest<300?'warn':'ok'}">Lowest in next 14 days: ${fmt0(lowest)}</span>
  ${lateN?`<span class="pill bad">${lateN} late</span>`:''}</div>
  ${runway(pending)}
  <div class="acts" style="margin:8px 0"><button class="btn primary" id="setbal">Update balance</button></div></section>
  <h2>Coming up</h2>`;
  let last='';
  const shown=pending.slice(0,40);
  if(!shown.length)h+='<p class="note">Nothing due in the next 14 days.</p>';
  let open=false;
  shown.forEach(e=>{
    const key=e.d<TODAY?'Late':e.d;
    if(key!==last){if(open)h+='</div>';
      const lab=key==='Late'?'Late — still unpaid':(e.d===TODAY?'Today · ':'')+dlabel(pd(e.d));
      h+=`<div class="day">${lab}</div><div class="list">`;open=true;last=key}
    h+=row(e,key==='Late');
  });
  if(open)h+='</div>';
  return h;
}
function monthKeys(){const k=[];EV.forEach(e=>{const m=e.d.slice(0,7);if(k[k.length-1]!==m)k.push(m)});return k}
function viewMonth(){
  const keys=monthKeys();
  if(!S.month||!keys.includes(S.month))S.month=keys.includes(TODAY.slice(0,7))?TODAY.slice(0,7):keys[0];
  const i=keys.indexOf(S.month),list=EV.filter(e=>e.d.slice(0,7)===S.month);
  const inc=list.reduce((a,e)=>a+e.i,0),out=list.reduce((a,e)=>a+e.o,0);
  const afters=list.map(e=>P.after[e.id]).filter(x=>x!==undefined);
  const low=afters.length?Math.min(...afters):null;
  const [y,m]=S.month.split('-').map(Number);
  let h=`<div class="nav"><button class="btn" id="prev" ${i===0?'disabled':''} aria-label="Previous month">‹</button>
  <div class="m">${MN[m-1]} ${y}</div><button class="btn" id="next" ${i===keys.length-1?'disabled':''} aria-label="Next month">›</button></div>
  <div class="stats"><div class="stat"><div class="k">Money in</div><div class="v num">${fmt0(inc)}</div></div>
  <div class="stat"><div class="k">Money out</div><div class="v num">${fmt0(out)}</div></div>
  <div class="stat"><div class="k">Lowest cash</div><div class="v num" style="color:${low!==null&&low<0?'var(--bad)':'inherit'}">${low===null?'—':fmt0(low)}</div></div></div>`;
  let last='';let open=false;
  list.forEach(e=>{
    if(e.d!==last){if(open)h+='</div>';h+=`<div class="day">${dlabel(pd(e.d))}</div><div class="list">`;open=true;last=e.d}
    h+=row(e,false);
  });
  if(open)h+='</div>';
  h+='<p class="note">Groceries and DoorDash aren’t listed — they roughly cancel out. Tap a box when a payment or paycheck is done.</p>';
  return h;
}
function ov(d){const o=S.dbt[d.n];return o?Object.assign({},d,{bal:o.orig,apr:o.apr,min:o.min,due:o.due}):d}

    if(!(min>=0)){$('#d-min').focus();return}if(!(due>=1&&due<=31)){$('#d-due').focus();return}
    S.dbt[n]={orig,apr:apr/100,min,due};S.bal[n]=cur;save();$('#dlg').close();rerender();toast('Saved');return}
  if(t.id==='dbclear'){const n=t.dataset.oid;delete S.dbt[n];delete S.bal[n];save();$('#dlg').close();rerender();return}
  if(t.id==='hidepay'||t.id==='hideonly'){const n=t.dataset.oid;let ids=[];
    if(t.id==='hidepay'){ids=EV.filter(payOf(n)).map(e=>e.id);ids.forEach(id=>{S.over[id]=Object.assign({},S.over[id],{del:1})})}
    S.hidden[n]=ids;refresh();$('#dlg').close();rerender();toast('Removed');return}
  if(t.id==='undoall'){if(confirm('Undo every edit and removal you made to the schedule and balances? Your added income and debts stay.')){S.over={};S.hidden={};S.bal={};S.dbt={};refresh();rerender()}return}
  if(t.id==='add'||t.id==='add2'){openAdd('inc');return}
  if(t.id==='adddebt'){openAdd('debt');return}
  if(t.dataset.addtype){openAdd(t.dataset.addtype);return}
  if(t.dataset.rm){const [k,id]=t.dataset.rm.split(':');
    if(k==='inc')S.custom.inc=S.custom.inc.filter(c=>c.id!==id);else S.custom.debts=S.custom.debts.filter(c=>c.id!==id);
    refresh();rerender();toast('Removed');return}
  if(t.id==='saveadd'){
    const val=id=>$('#'+id).value.trim();
    if(t.dataset.type==='inc'){
      const name=val('f-name'),amt=parseFloat(val('f-amt')),date=val('f-date'),rep=val('f-rep');
      if(!name){$('#f-name').focus();return}if(!(amt>0)){$('#f-amt').focus();return}if(!date){$('#f-date').focus();return}
      const o={name,amt,date,rep,day:parseInt(date.slice(8,10),10)};if(t.dataset.editid)Object.assign(S.custom.inc.find(c=>c.id===t.dataset.editid),o);else S.custom.inc.push(Object.assign({id:'x'+Date.now()},o));
    }else{
      const n=val('f-name'),bal=parseFloat(val('f-bal')),apr=parseFloat(val('f-apr'))/100,min=parseFloat(val('f-min')),due=parseInt(val('f-due'),10);
      if(!n){$('#f-name').focus();return}if(!(bal>0)){$('#f-bal').focus();return}if(isNaN(apr)||apr<0){$('#f-apr').focus();return}
      if(!(min>0)){$('#f-min').focus();return}if(!(due>=1&&due<=28)){$('#f-due').focus();return}
      const orig=parseFloat(val('f-orig'));const o={n,bal,apr,min,due,orig:orig>0?orig:undefined};if(t.dataset.editid)Object.assign(S.custom.debts.find(c=>c.id===t.dataset.editid),o);else S.custom.debts.push(Object.assign({id:'x'+Date.now()},o));
    }
    refresh();$('#dlg').close();render();toast(t.dataset.editid?'Saved':'Added');return}
  if(t.id==='cancel'){$('#dlg').close();return}
  if(t.id==='clearbal'){S.anchor=null;save();P=project();$('#dlg').close();render();return}
  if(t.id==='savebal'){
    const v=parseFloat($('#bal').value);
    if(isNaN(v)){$('#bal').focus();return}
    S.anchor={balance:v,snap:Object.assign({},S.done),date:TODAY};save();P=project();$('#dlg').close();render();toast('Balance saved');return}
  if(t.id==='reset'){
    if(confirm('Clear all ticks, paid-off marks and your entered balance?')){S.done={};DATA.events.forEach(e=>{if(e.p)S.done[e.id]=1});S.anchor=null;S.paidOff={};S.over={};S.hidden={};S.bal={};S.dbt={};refresh();render()}
    return}
  if(t.id==='share'){
    const done=EV.filter(e=>S.done[e.id]&&(!S.anchor||!S.anchor.snap[e.id])&&!e.p).map(e=>e.l+' ('+e.d+')');
    const late=EV.filter(e=>!S.done[e.id]&&e.d<TODAY).map(e=>e.l+' ('+e.d+')');
    const txt='Budget update for '+TODAY+'\nBalance: '+(S.anchor?fmt(P.now):'not entered')+'\nMarked done: '+(done.join('; ')||'none')+
      '\nStill unpaid and past due: '+(late.join('; ')||'none')+'\nPaid-off accounts: '+(Object.keys(S.paidOff).join(', ')||'none');
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Update copied'),()=>{prompt('Copy this update:',txt)});
    return}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='ic-name'){S.appName=ev.target.value.trim()||'Budget';save();applyIcon()}
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='ic-file')return;
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
      const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
      x.drawImage(im,sx,sy,s,s,0,0,180,180);
      S.icon={kind:'img',data:c.toDataURL('image/png'),glyph:S.icon.glyph||'bars',color:S.icon.color||'#1e6a8a'};
      save();applyIcon();rerender();toast('Icon updated')};
    im.onerror=()=>toast('That file couldn’t be read as a picture');
    im.src=r.result};
  r.readAsDataURL(f);
});
applyIcon();
render();
if(IS_PWA&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
